[project]
name = "excel-cli"
version = "0.1.0"
description = "CLI spreadsheet editor with formula support and Excel export"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textual>=0.47.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
excel-cli = "excel_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["excel_cli*"]